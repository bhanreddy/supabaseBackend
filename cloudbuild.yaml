steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/supabasebackend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/supabasebackend:latest'
      - '.'

  # Refuse a backend rollout when its required database migration has not been
  # applied. The check is read-only; operators run the reviewed migration after
  # backup and before triggering this deployment.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'docker'
    args:
      - 'run'
      - '--rm'
      - '--env'
      - 'DATABASE_URL_DIRECT'
      - 'gcr.io/$PROJECT_ID/supabasebackend:$COMMIT_SHA'
      - 'node'
      - 'scripts/migrate_release.js'
      - '--check'
    secretEnv: ['DATABASE_URL_DIRECT']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/supabasebackend:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/supabasebackend:latest']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'supabasebackend'
      - '--image=gcr.io/$PROJECT_ID/supabasebackend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--port=8080'
      # Keep 1 instance warm so the in-memory token cache stays hot and cold
      # starts don't trigger a storm of Supabase Auth getUser() calls on surges.
      - '--min-instances=1'
      # Each instance owns a 10-connection postgres.js pool and analytics routes
      # fan out into several concurrent queries. Cloud Run's default concurrency
      # (80) lets one instance accept substantially more database work than the
      # pool can service before the edge timeout. Keep request concurrency below
      # the pool size so Cloud Run scales instances instead of building a long
      # in-process database queue.
      - '--concurrency=8'
      - '--set-secrets=DATABASE_URL=DATABASE_URL:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest'
      - '--set-env-vars=NODE_ENV=production,PORT=8080,RATE_LIMIT_API_MAX=2000,RATE_LIMIT_API_WINDOW_MS=900000'

images:
  - 'gcr.io/$PROJECT_ID/supabasebackend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/supabasebackend:latest'

options:
  logging: CLOUD_LOGGING_ONLY

availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/DATABASE_URL_DIRECT/versions/latest'
      env: 'DATABASE_URL_DIRECT'
